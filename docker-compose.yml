# Production-style stack: breakAPI behind Caddy (automatic HTTPS).
#   cp .env.example .env   # fill it in
#   edit deploy/Caddyfile  # your domain
#   docker compose up -d
#   docker compose logs breakapi | grep "setup token"   # then open https://<domain>/#/setup
services:
  breakapi:
    build: .
    image: breakapi:latest
    restart: unless-stopped
    env_file: .env
    volumes:
      - breakapi-data:/data
    expose:
      - "7300"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - breakapi

  # Local mail catcher for staging: `docker compose --profile mail up`, then set SMTP_HOST=mailpit SMTP_PORT=1025 SMTP_SECURE=false.
  mailpit:
    image: axllent/mailpit:latest
    profiles: ["mail"]
    ports:
      - "127.0.0.1:8025:8025"

volumes:
  breakapi-data:
  caddy-data:
  caddy-config:
